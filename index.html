<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI സ്കാൻ</title>

<style>
body{
    background:#111;
    color:#fff;
    font-family:sans-serif;
    text-align:center;
    margin:0;
    padding:30px;
}
img{
    width:250px;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 0 20px #00ff00;
}
</style>
</head>
<body>

<h1>🤖 AI മുഖം പരിശോധിക്കുന്നു...</h1>
<p id="status">ദയവായി കാത്തിരിക്കുക...</p>

<div id="result" style="display:none;">
    <img src="friend.jpg" alt="Friend">

    <h2>😂 പരിശോധന പൂർത്തിയായി!</h2>

    <h3>
    പേര്: നാണമില്ലാത്ത ജീവി 🤣<br><br>
    പുഞ്ചിരി: 100% 😁<br>
    ഉറക്കം: 2 മണിക്കൂർ 😴<br>
    ഫോൺ ഉപയോഗം: 25 മണിക്കൂർ/ദിവസം 📱<br>
    പണി എടുക്കൽ: 0% 😆<br>
    സ്റ്റൈൽ: ഓവർ ലോഡ് 😎
    </h3>

    <h2 style="color:#00ff00;">ഇത് ഒരു തമാശ മാത്രമാണ് 😂❤️</h2>
</div>

<script>
setTimeout(()=>{
    document.getElementById("status").style.display="none";
    document.getElementById("result").style.display="block";
},4000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funny Face Tracker</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
}

video{
    width:90%;
    max-width:700px;
    border-radius:15px;
    margin-top:20px;
    border:4px solid white;
}

#comment{
    font-size:28px;
    margin:20px;
    color:#ffd700;
}

button{
    padding:12px 24px;
    font-size:18px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    margin-top:15px;
}
</style>
</head>
<body>

<h1>😂 Funny Face Tracker 😂</h1>

<button onclick="startCamera()">Start Camera</button>

<br>

<video id="video" autoplay playsinline muted></video>

<div id="comment">Click "Start Camera"</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
const video = document.getElementById("video");
const comment = document.getElementById("comment");

const jokes = [
    "🧐 Human detected!",
    "😂 That's a legendary face!",
    "😎 Main character energy!",
    "🍕 Face found. Pizza still missing.",
    "🤓 Looking smart today!",
    "🚀 Ready for takeoff!",
    "🎭 Comedy level: Maximum.",
    "🕶️ Too cool for this camera.",
    "🐵 Human confirmed.",
    "💀 AI is confused by your beauty."
];

async function startCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        video.srcObject = stream;

        comment.textContent = "Loading face detection...";

        await faceapi.nets.tinyFaceDetector.loadFromUri(
            "https://justadudewhohacks.github.io/face-api.js/models"
        );

        comment.textContent = "Camera started!";

        detectFace();

    } catch (err) {
        comment.textContent =
            "❌ Camera permission denied or unavailable.";
        console.error(err);
    }
}

function detectFace() {
    setInterval(async () => {
        const detection = await faceapi.detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions()
        );

        if (detection) {
            comment.textContent =
                jokes[Math.floor(Math.random() * jokes.length)];
        } else {
            comment.textContent =
                "👀 No face detected. Come back!";
        }
    }, 3000);
}
</script>

</body>
</html>

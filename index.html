<!DOCTYPE html>
<html>
<head>
    <title>Funny Face Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: white;
        }

        video {
            width: 640px;
            max-width: 90%;
            border: 4px solid #fff;
            border-radius: 10px;
            margin-top: 20px;
        }

        #comment {
            font-size: 28px;
            margin-top: 20px;
            color: #ffeb3b;
        }
    </style>
</head>
<body>

<h1>😂 Funny Face Tracker 😂</h1>

<video id="video" autoplay muted></video>

<div id="comment">Looking for a face...</div>

<script src="https://cdn.jsdelivr.net/npm/face-api.js"></script>

<script>
const video = document.getElementById('video');
const commentBox = document.getElementById('comment');

const comments = [
    "🧐 Ah yes, a human has appeared!",
    "😂 That face deserves its own TV show!",
    "🤓 Looking smart today... suspiciously smart.",
    "😎 Main character detected.",
    "🍕 Face found. Pizza not found.",
    "🚀 Ready for launch, Captain Face!",
    "🐵 99% human, 1% monkey.",
    "🎭 Comedy level: Maximum.",
    "🕶️ Too cool for this website.",
    "💀 My AI brain is confused by this beauty."
];

async function startVideo() {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
}

Promise.all([
    faceapi.nets.tinyFaceDetector.loadFromUri(
        'https://justadudewhohacks.github.io/face-api.js/models'
    )
]).then(startVideo);

video.addEventListener('play', () => {
    setInterval(async () => {
        const detection = await faceapi.detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions()
        );

        if (detection) {
            const randomComment =
                comments[Math.floor(Math.random() * comments.length)];
            commentBox.textContent = randomComment;
        } else {
            commentBox.textContent = "👀 Where did your face go?";
        }
    }, 3000);
});
</script>

</body>
</html>
